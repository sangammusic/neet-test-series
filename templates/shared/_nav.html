<nav class="sticky top-0 z-50 bg-[#0a0a0a]/80 backdrop-blur-md border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        
        <!-- Brand Logo -->
        <a href="{{ url_for('user.landing') }}" class="font-display font-bold text-2xl tracking-tight text-white flex items-center gap-2 hover:opacity-80 transition-opacity">
            SANGAM <span class="text-gold">STUDY</span>
        </a>

        <!-- Right Actions -->
        <div class="flex items-center gap-6 text-sm font-medium">
            {% if session.get('user_id') %}
                
                <!-- Kept exactly as requested, extra links permanently removed -->
                <a href="{{ url_for('user.switch_stream') }}" class="text-gray-400 hover:text-white transition-colors font-semibold hidden sm:block">Switch stream</a>
                
                <!-- Modern Dropdown Menu for User Account -->
                <div x-data="{ menuOpen: false }" class="relative z-50">
                    <button @click="menuOpen = !menuOpen" @click.outside="menuOpen = false" class="flex items-center gap-2 text-gray-300 hover:text-white transition-colors focus:outline-none font-bold py-1.5 px-3 rounded-lg border border-transparent hover:bg-white/5 hover:border-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                        <span class="hidden sm:inline">My Account</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200" :class="menuOpen ? 'rotate-180 text-gold' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    
                    <!-- Dropdown Box (Glassmorphic Dark) -->
                    <div x-show="menuOpen" x-cloak x-transition.opacity.duration.200ms class="absolute right-0 mt-3 w-52 bg-[#161616] border border-white/10 rounded-xl shadow-2xl overflow-hidden origin-top-right backdrop-blur-xl">
                        <div class="px-4 py-3 border-b border-white/5 bg-black/20">
                            <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Settings</p>
                        </div>
                        
                        <a href="{{ url_for('user.settings') }}" class="block px-4 py-3 text-sm font-bold text-gray-300 hover:bg-white/5 hover:text-gold border-b border-white/5 transition-colors">
                            ⚙️ Account Settings
                        </a>
                        
                        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-3 text-sm font-bold text-red-400 hover:bg-red-500/10 transition-colors">
                            🚪 Log Out
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="text-gray-300 hover:text-white transition-colors font-semibold">Log in</a>
                <a href="{{ url_for('auth.register') }}"
                   class="bg-gold text-ink px-5 py-2.5 rounded-md font-bold hover:bg-gold-light transition-all shadow-[0_0_15px_rgba(212,160,23,0.3)] hover:shadow-[0_0_20px_rgba(212,160,23,0.5)]">
                    Create account
                </a>
            {% endif %}
        </div>
    </div>
</nav>
