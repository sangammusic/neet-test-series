<nav class="bg-ink text-paper border-b-2 border-gold/30">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="{{ url_for('user.landing') }}" class="font-display font-semibold text-xl tracking-tight">
            SANGAM <span class="text-gold">STUDY</span>
        </a>
        <div class="flex items-center gap-6 text-sm font-medium">
            {% if session.get('user_id') %}
                <!-- BUGFIX: this used to point at user.profile (attempts-history
                     only page, often empty for new users, no way back to the
                     real dashboard). Now points at user.my_dashboard, which
                     redirects to the actual stream dashboard with the two
                     practice/test cards. Attempt history is still reachable
                     via the "My Attempts" link below. -->
                <a href="{{ url_for('user.my_dashboard') }}" class="hover:text-gold transition-colors">My Dashboard</a>
                <a href="{{ url_for('user.profile') }}" class="hover:text-gold transition-colors">My Attempts</a>
                <a href="{{ url_for('user.switch_stream') }}" class="hover:text-gold transition-colors">Switch stream</a>
                
                <!-- SANGAM FIX: Modern Dropdown Menu for User Account -->
                <div x-data="{ menuOpen: false }" class="relative z-50">
                    <button @click="menuOpen = !menuOpen" @click.outside="menuOpen = false" class="flex items-center gap-1.5 hover:text-gold transition-colors focus:outline-none font-bold py-1">
                        My Account
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200" :class="menuOpen ? 'rotate-180 text-gold' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    
                    <!-- Dropdown Box -->
                    <div x-show="menuOpen" x-cloak x-transition.opacity.duration.200ms class="absolute right-0 mt-4 w-52 bg-white text-ink rounded-xl shadow-2xl border border-gray-200 overflow-hidden origin-top-right">
                        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Settings</p>
                        </div>
                        
                        <!-- Link to the upcoming Settings page for Username & Password change -->
                        <a href="{{ url_for('user.settings') }}" class="block px-4 py-3 text-sm font-bold text-gray-700 hover:bg-gold/10 hover:text-gold border-b border-gray-50 transition-colors">
                            ⚙️ Account Settings
                        </a>
                        
                        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-3 text-sm font-bold text-red-600 hover:bg-red-50 transition-colors">
                            🚪 Log Out
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="hover:text-gold transition-colors">Log in</a>
                <a href="{{ url_for('auth.register') }}"
                   class="bg-gold text-ink px-4 py-2 rounded-sm font-semibold hover:bg-gold-light transition-colors">
                    Create account
                </a>
            {% endif %}
        </div>
    </div>
</nav>
