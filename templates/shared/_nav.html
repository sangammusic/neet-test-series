<nav class="sangam-topnav sticky top-0 z-50 bg-[#0d1017]/90 backdrop-blur-xl border-b border-white/10 transition-all duration-200">
    <div class="max-w-5xl mx-auto px-3.5 sm:px-5 py-2.5 flex items-center justify-between gap-2">
        
        <!-- Brand Logo: STUDY SANGAM HUB (Inline SVG — Never Breaks) -->
        <a href="{{ url_for('user.my_dashboard') if session.get('user_id') else url_for('user.landing') }}"
           class="flex items-center gap-2.5 hover:opacity-90 transition-opacity min-w-0">
            <svg class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg shrink-0 shadow-sm" aria-label="Study Sangam Hub Logo">
                <use href="#sangam-logo-crest"></use>
            </svg>
            <div class="leading-tight truncate">
                <span class="font-display font-bold text-sm sm:text-lg tracking-tight text-white block truncate">
                    STUDY <span class="text-gold">SANGAM</span> HUB
                </span>
                <span class="text-[8px] sm:text-[9px] font-bold tracking-widest uppercase text-gray-400 hidden sm:block">
                    CONNECT • LEARN • GROW
                </span>
            </div>
        </a>

        <!-- Right Controls in Strict Sequence: 1. Theme Switch | 2. Admin (if admin) | 3. Profile Menu -->
        <div class="flex items-center gap-2 text-xs font-semibold shrink-0">
            
            <!-- 1. Professional Side Switch Button (Dark Mode / White Mode) -->
            <button type="button"
                    data-theme-switch
                    onclick="window.toggleSangamTheme()"
                    class="sangam-theme-switch"
                    title="Switch between Dark Mode and White Mode"
                    aria-label="Toggle Dark or White Mode">
                <span class="sangam-switch-track">
                    <span class="sangam-switch-thumb"></span>
                </span>
                <span data-theme-icon>🌙</span>
                <span data-theme-label>Dark</span>
            </button>

            {% if session.get('user_id') %}
                {% set nav_ps = premium_status() %}
                
                <!-- 2. Single Direct Admin Button (Only if Admin — No duplicate dropdowns) -->
                {% if nav_ps and nav_ps.is_admin %}
                <a href="{{ url_for('admin.dashboard') }}" data-replace-link class="btn-cute">
                    <span>🛠️ Admin</span>
                </a>
                {% endif %}
                
                <!-- 3. Single User Profile Dropdown (No duplicate links anywhere else) -->
                <div x-data="{ menuOpen: false }" class="relative z-50">
                    <button type="button" @click="menuOpen = !menuOpen" @click.outside="menuOpen = false" class="btn-cute-soft">
                        <span>👤</span>
                        <span class="hidden sm:inline">Profile</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transition-transform duration-150" :class="menuOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    
                    <div x-show="menuOpen" x-cloak x-transition.opacity.duration.150ms
                         class="sangam-dropdown absolute right-0 mt-2 w-48 bg-[#121621] border border-white/15 rounded-xl shadow-2xl overflow-hidden origin-top-right backdrop-blur-xl py-1">
                        <a href="{{ url_for('user.profile') }}" class="block px-4 py-2.5 text-xs font-bold text-gray-200 hover:bg-white/10 border-b border-white/10 transition-colors">
                            📊 My Attempts
                        </a>
                        <a href="{{ url_for('payments.history') }}" class="block px-4 py-2.5 text-xs font-bold text-gray-200 hover:bg-white/10 border-b border-white/10 transition-colors">
                            🛍️ My Purchases
                        </a>
                        <a href="{{ url_for('user.settings') }}" class="block px-4 py-2.5 text-xs font-bold text-gray-200 hover:bg-white/10 border-b border-white/10 transition-colors">
                            ⚙️ Settings
                        </a>
                        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2.5 text-xs font-bold text-red-400 hover:bg-red-500/10 transition-colors">
                            🚪 Log Out
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="btn-cute-soft">Log In</a>
                <a href="{{ url_for('auth.register') }}" class="btn-cute">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
