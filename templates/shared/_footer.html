<footer class="border-t border-white/10 mt-20 relative z-10 bg-[#07090f]/85 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-400">
        <p class="text-gray-400 font-medium">&copy; {{ 2026 }} SANGAM STUDY. Built for aspirants, by aspirants.</p>
        <nav class="flex flex-wrap justify-center sm:justify-end gap-x-5 gap-y-1 text-gray-400" aria-label="Legal">
            <a href="{{ url_for('legal.terms') }}" class="hover:text-gold transition-colors">Terms</a>
            <a href="{{ url_for('legal.privacy') }}" class="hover:text-gold transition-colors">Privacy</a>

<!-- FLOATING SUPPORT WIDGET (Bottom-Right Headset + Callout Pill matching reference screenshot) -->
<div x-data="{ supportTipOpen: true }" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2.5 select-none">
    
    <!-- Callout Pill: "Need Support? We're here to help!" -->
    <div x-show="supportTipOpen"
         x-transition.opacity.duration.200ms
         class="relative bg-[#11131a]/95 border border-gold/50 rounded-2xl px-3.5 py-2.5 shadow-[0_8px_28px_rgba(0,0,0,0.7),0_0_20px_rgba(212,160,23,0.14)] backdrop-blur-xl">
        
        <!-- Dismiss (X) Button -->
        <button type="button"
                @click.stop.prevent="supportTipOpen = false"
                aria-label="Close support prompt"
                class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-[#171a24] border border-gold/50 text-gray-300 hover:text-white hover:border-gold flex items-center justify-center text-[11px] leading-none shadow-md transition-colors">
            &times;
        </button>

        <a href="{{ support_url }}" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-2.5 pr-1 group">
            <div class="w-7 h-7 rounded-lg bg-gold/15 border border-gold/30 flex items-center justify-center text-gold shrink-0 group-hover:bg-gold/25 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 18v-6a9 9 0 0118 0v6" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z" />
                </svg>
            </div>
            <div class="leading-tight">
                <p class="text-xs font-bold text-white group-hover:text-gold transition-colors">Need Support?</p>
                <p class="text-[10px] font-medium text-gray-400 mt-0.5">We're here to help!</p>
            </div>
        </a>
    </div>

    <!-- Circular Glowing Headset Button -->
    <a href="{{ support_url }}" target="_blank" rel="noopener noreferrer"
       aria-label="Contact Support"
       class="w-12 h-12 rounded-full bg-[#11131a] border-2 border-gold/75 shadow-[0_0_22px_rgba(212,160,23,0.35)] hover:shadow-[0_0_30px_rgba(212,160,23,0.6)] hover:border-gold flex items-center justify-center text-white hover:text-gold hover:scale-105 transition-all duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 18v-6a9 9 0 0118 0v6" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z" />
        </svg>
    </a>
</div>
