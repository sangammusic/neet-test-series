<div x-data="{ supportTipOpen: false }" class="fixed bottom-4 right-4 z-50 flex flex-col items-end gap-2 select-none">
    <div x-show="supportTipOpen" x-cloak
         x-transition.opacity.duration.200ms
         class="relative sangam-card bg-[#14110e]/95 border border-gold/45 rounded-xl px-3 py-2 shadow-xl backdrop-blur-xl">
        <button type="button"
                @click.stop.prevent="supportTipOpen = false"
                aria-label="Close support prompt"
                class="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-[#171a24] border border-gold/50 text-gray-300 hover:text-white flex items-center justify-center text-[10px] leading-none">
            &times;
        </button>
        <a href="{{ support_url }}" target="_blank" rel="noopener noreferrer"
           class="flex items-center gap-2 pr-1 group">
            <div class="leading-tight">
                <p class="text-[11px] font-bold text-white group-hover:text-gold transition-colors">Need Help?</p>
                <p class="text-[10px] font-medium text-gray-400">Chat on Telegram</p>
            </div>
        </a>
    </div>

    <a href="{{ support_url }}" target="_blank" rel="noopener noreferrer"
