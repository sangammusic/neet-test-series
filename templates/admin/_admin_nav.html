<nav class="bg-[#080b12] border-b border-white/5 px-6 py-4 font-body">
  <div class="max-w-6xl mx-auto flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="{{ url_for('admin.dashboard') }}" class="font-display text-xl font-bold tracking-tight text-white flex items-center gap-2 hover:opacity-90 transition-opacity">
      SANGAM <span class="text-indigo-500">Admin</span>
    </a>
    
    <!-- Clean Navigation Actions -->
    <div class="flex items-center gap-2 md:gap-4 text-sm">
      
      <!-- SANGAM FIX: Added Admin check so normal users never see this if it accidentally loads -->
      {% if current_user.is_authenticated and current_user.is_admin %}
      
      <!-- Universal Go Back Button (SANGAM FIX) -->
      <!-- Removed history.back() as it causes stale modal issues. Better to give a proper link if possible, or leave it for pure browser history but know it risks modals -->
      <button onclick="history.back()" class="text-gray-400 hover:text-indigo-400 font-bold flex items-center gap-2 px-3 py-2 rounded-lg transition-colors focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go Back
      </button>

      <div class="w-px h-5 bg-white/10 hidden sm:block"></div>

      <!-- Back to Main Site -->
      <a href="{{ url_for('user.landing') }}" class="text-gray-400 hover:text-white font-medium bg-white/5 border border-white/10 hover:border-white/20 hover:bg-white/10 px-4 py-2 rounded-lg transition-all shadow-sm flex items-center gap-2">
        Exit to Site
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
      
      {% endif %}
      
    </div>
  </div>
