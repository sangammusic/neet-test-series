<nav class="sangam-admin-topnav sticky top-0 z-50 bg-[#0d1017]/90 backdrop-blur-xl border-b border-white/10 transition-all duration-200">
    <div class="max-w-4xl mx-auto px-3 sm:px-5 py-2 flex items-center justify-between gap-2">
        
        <!-- Single Brand Logo + Admin Badge -->
        <a href="{{ url_for('admin.dashboard') }}" data-replace-link class="flex items-center gap-2 hover:opacity-90 transition-opacity min-w-0">
            <img src="{{ url_for('static', filename='img/logo-mark.png') }}"
                 onerror="this.onerror=null;this.src=window.SANGAM_LOGO_URI"
                 alt="Study Sangam Hub"
                 class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg object-contain shrink-0 shadow-sm">
            <div class="flex items-center gap-1.5 truncate">
                <span class="font-display font-bold text-xs sm:text-base tracking-tight text-white truncate">
                    STUDY <span class="text-gold">SANGAM</span> HUB
                </span>
                <span class="text-[8px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-500/15 border border-emerald-400/30 px-1.5 py-0.5 rounded shrink-0">Admin</span>
            </div>
        </a>

        <!-- Right Controls: Theme Switch | Admin Home | Student View -->
        <div class="flex items-center gap-1.5 sm:gap-2 text-xs font-semibold shrink-0">
            <button type="button"
                    data-theme-switch
                    onclick="window.toggleSangamTheme()"
                    class="sangam-theme-switch"
                    title="Switch between Dark Mode and White Mode"
                    aria-label="Toggle Dark or White Mode">
                <span class="sangam-switch-track">
                    <span class="sangam-switch-thumb"></span>
                </span>
                <span data-theme-icon>🌙</span>
                <span data-theme-label>Dark</span>
            </button>

            {% if request.path != '/admin/dashboard' %}
            <a href="{{ url_for('admin.dashboard') }}" data-replace-link class="btn-cute-soft">
                <span>🛠️ Admin Home</span>
            </a>
            {% endif %}

            <a href="{{ url_for('user.my_dashboard') }}" data-replace-link class="btn-cute">
                <span>🎓 Student View</span>
            </a>
        </div>
    </div>
</nav>
