{% extends "shared/base.html" %}
{% block title %}{{ chapter.name }}{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto px-6 pt-12 pb-24">
  <p class="text-gold font-semibold text-sm mb-2">{{ chapter.subjects.name if chapter.subjects }}</p>
  <h1 class="font-display text-2xl font-semibold text-ink mb-8">{{ chapter.name }}</h1>
  <div class="grid sm:grid-cols-2 gap-6">
    <a href="{{ url_for('user.practice_category', slug=stream.slug, chapter_id=chapter.id, mode='mcq') }}"
       class="block p-8 border border-ink/10 rounded-lg hover:border-gold/50 hover:shadow-md transition-all bg-white text-center">
      <p class="font-display text-lg font-semibold text-ink">MCQ Practice</p>
      <p class="text-sm text-ink/60 mt-1">Topic-wise or random chapter practice</p>
    </a>
    <a href="{{ url_for('user.practice_category', slug=stream.slug, chapter_id=chapter.id, mode='pyq') }}"
       class="block p-8 border border-ink/10 rounded-lg hover:border-gold/50 hover:shadow-md transition-all bg-white text-center">
      <p class="font-display text-lg font-semibold text-ink">PYQ Practice</p>
      <p class="text-sm text-ink/60 mt-1">Previous Year Questions for this chapter</p>
    </a>
  </div>
</section>
{% endblock %}
