{% extends "shared/base.html" %}
{% block title %}Chapters — {{ stream.name }}{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto px-6 pt-12 pb-24">
  <p class="text-gold font-semibold text-sm mb-2">{{ stream.name.upper() }} · CHAPTER-WISE PRACTICE</p>
  <h1 class="font-display text-2xl font-semibold text-ink mb-8">Choose a Chapter</h1>
  <div class="grid sm:grid-cols-2 gap-4">
    {% for c in chapters %}
    <a href="{{ url_for('user.practice_chapter_detail', slug=stream.slug, chapter_id=c.id) }}"
       class="block p-5 border border-ink/10 rounded-lg hover:border-gold/50 hover:shadow-sm transition-all bg-white font-medium text-ink">
      {{ c.name }}
    </a>
    {% else %}
    <p class="text-ink/50 text-sm col-span-full">No chapters yet — check back soon.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
