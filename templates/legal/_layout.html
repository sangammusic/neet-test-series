{% extends "shared/base.html" %}
{% block title %}{{ page_title }} — SANGAM STUDY{% endblock %}
{% block extra_head %}
<style>
  .legal h2 { font-family: 'Lora', serif; font-size: 1.25rem; font-weight: 700; color: #fff; margin-top: 2rem; margin-bottom: .5rem; }
  .legal p  { margin-top: .75rem; }
  .legal ul { list-style: disc; padding-left: 1.4rem; margin-top: .75rem; }
  .legal li { margin-top: .5rem; }
  .legal a  { color: #D4A017; font-weight: 600; }
  .legal a:hover { text-decoration: underline; }
</style>
{% endblock %}
{% block content %}
<article class="relative z-10 mx-auto max-w-2xl px-5 sm:px-6 pt-12 pb-24">
  <h1 class="font-display text-4xl font-bold text-white">{{ page_title }}</h1>
  <p class="mt-2 text-sm text-gray-500">Last updated 13 October 2026</p>
  <div class="legal mt-6 leading-relaxed text-gray-300">
    {% block body %}{% endblock %}
  </div>
</article>
{% endblock %}
