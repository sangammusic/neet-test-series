{% extends "shared/base.html" %}
{% block title %}Register — SANGAM STUDY{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 px-4">
  <h1 class="font-display text-3xl text-ink mb-2">Create your account</h1>
  <p class="text-ink/60 mb-8">Start tracking your progress across NEET/JEE prep.</p>

  <form method="POST" class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-ink mb-1">Full Name</label>
      <input type="text" name="full_name" required
             class="w-full rounded-md border border-ink/15 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
    </div>
    <div>
      <label class="block text-sm font-medium text-ink mb-1">Email</label>
      <input type="email" name="email" required
             class="w-full rounded-md border border-ink/15 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
    </div>
    <div>
      <label class="block text-sm font-medium text-ink mb-1">Password</label>
      <input type="password" name="password" required minlength="6"
             class="w-full rounded-md border border-ink/15 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
    </div>
    <button type="submit"
            class="w-full bg-gold text-ink font-semibold py-2.5 rounded-md hover:bg-gold-light transition-colors">
      Create Account
    </button>
  </form>

  <p class="text-sm text-ink/60 mt-6 text-center">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-gold font-medium hover:underline">Log in</a>
  </p>
</div>
{% endblock %}
